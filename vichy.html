  <script>
    !function(f,b,e,v,n,t,s)
    {
      if(f.fbq)return;
      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;
      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=!0;
      t.src=v;

      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)
    }(
      window,
      document,
      'script',
      'https://connect.facebook.net/en_US/fbevents.js'
    );

    /*
     * SENİN PIXEL ID'N
     */
    fbq('init', '1637036251170241');

    /*
     * LPV için temel PageView
     */
    fbq('track', 'PageView');

  </script>

  <noscript>
    <img
      height="1"

  <!-- =========================================================
       SAYFA AYARLARI
       ========================================================= -->

  <script>

    /*
     * HER ÜRÜNDE SADECE BU İKİ DEĞERİ DEĞİŞTİR
     */

    var urunAdi = "vichy";

    var hedefLink = "https://ty.gl/qr2wc8r4ye4vj";


    /*
     * CİHAZ TESPİTİ
     */

    var userAgent = navigator.userAgent || navigator.vendor || window.opera;

    var isIOS =
      /iPad|iPhone|iPod/.test(userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    var isAndroid = /Android/i.test(userAgent);


    /*
     * UTM PARAMETRELERİNİ AL
     *
     * Örnek:
     * ?utm_source=facebook
     * &utm_medium=paid
     * &utm_campaign=altinyildiz
     * &utm_content=reklam1
     */

    var urlParams = new URLSearchParams(window.location.search);

    var utmSource   = urlParams.get('utm_source') || '';
    var utmMedium   = urlParams.get('utm_medium') || '';
    var utmCampaign = urlParams.get('utm_campaign') || '';
    var utmContent  = urlParams.get('utm_content') || '';


    /*
     * TRENDYOL CLICK EVENTİ
     *
     * Aynı kullanıcı butona birden fazla basarsa
     * event'in tekrar tekrar gönderilmesini önlüyoruz.
     */

    var trendyolClickSent = false;


    function sendTrendyolClick() {

      if (trendyolClickSent) {
        return;
      }

      trendyolClickSent = true;


      /*
       * Meta'ya gönderilen event
       */

      fbq('trackCustom', 'TrendyolClick', {

        product: urunAdi,

        device:
          isIOS ? 'ios' :
          isAndroid ? 'android' :
          'other',

        utm_source: utmSource,
        utm_medium: utmMedium,
        utm_campaign: utmCampaign,
        utm_content: utmContent

      });


      /*
       * İstersen Google Analytics / başka analiz sistemlerinde
       * kullanabilmek için aynı anda dataLayer'a da gönderiyoruz.
       */

      window.dataLayer = window.dataLayer || [];

      window.dataLayer.push({

        event: 'trendyol_click',

        product: urunAdi,

        device:
          isIOS ? 'ios' :
          isAndroid ? 'android' :
          'other',

        utm_source: utmSource,
        utm_medium: utmMedium,
        utm_campaign: utmCampaign,
        utm_content: utmContent

      });

    }


    /*
     * SAYFA AÇILDIKTAN SONRA
     */

    document.addEventListener('DOMContentLoaded', function() {

      var card = document.getElementById('card');

      var button = document.getElementById('action-btn');


      /*
       * Kartı göster
       */

      card.style.display = 'block';


      /*
       * Affiliate linkini butona koy
       */

      button.href = hedefLink;


      /*
       * Cihaz bilgisini ekrana yazdırmak zorunda değiliz.
       *
       * Ama CSS sınıfı olarak body'ye ekliyoruz.
       */

      if (isIOS) {

        document.body.classList.add('ios');

      } else if (isAndroid) {

        document.body.classList.add('android');

      } else {

        document.body.classList.add('other');

      }

    });


    /*
     * TRENDYOL BUTONUNA BASILDIĞINDA
     */

    function trendyolButtonClick(event) {

      sendTrendyolClick();

      /*
       * Normal link davranışına devam et.
       *
       * href zaten hedefLink'i içeriyor.
       */

    }

  </script>
